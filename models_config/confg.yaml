# ========================
# ROUTING CONFIG (DEFAULT)
# ========================
routing:
  default:
    high: openai_high
    medium: openai_medium
    low: openai_low
    nano: openai_low

  fallback:
    high: claude_high
    medium: claude_medium
    low: gemini_low
    nano: groq_nano


